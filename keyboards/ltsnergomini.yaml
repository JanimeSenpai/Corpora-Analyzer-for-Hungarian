name: "LTSN Ergo Mini"
#we have an unnecessary amount of keys defined for this layout
hardware:
  stagger_type: "columnar_stagger" # "row_stagger" or "columnar_stagger"
  num_rows: 5 #thumb row also counts!
  home_row_index: 2 #never forget to set the homerow index!
  optimal_finger_assignment: false
  angle_of_approach_degrees: 0.0 #ZERO for split keyboards! (usually 10.0 for normal keyboards)
  left:
    offsets: [ 0.50, 0.50, 0.25, 0.00, 0.25, 0.38]
    fingers: ["P", "P", "R", "M", "I", "I"]
    anchors: [ 1,1,2,3,4,4] #anchor is the home column of the finger that presses keys in this column
  right:
    offsets: [ 0.38, 0.25, 0.00, 0.25, 0.50, 0.50]
    fingers: [ "I", "I", "M", "R", "P", "P"]
    anchors: [1,1,2,3,4,4]
matrix: |
  __ _ _ __   __ _ w xq
  úó u á yí   fz k d h_
  öi o e aő   bl t s np
  cü . , éű   vr m g j-
thumb_left: "_"
thumb_right: "_"